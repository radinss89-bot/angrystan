<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>angrystan</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden; background: #000;
    font-family: system-ui, -apple-system, 'Segoe UI', Tahoma, sans-serif;
    user-select: none; -webkit-user-select: none; touch-action: none;
    -webkit-tap-highlight-color: transparent;
  }
  canvas { display: block; position: fixed; inset: 0; }

  /* HUD */
  #hud {
    position: fixed; top: 0; left: 0; right: 0; padding: 16px 20px;
    display: flex; justify-content: space-between; align-items: flex-start;
    pointer-events: none; color: #fff; z-index: 10;
  }
  #score {
    font-size: 20px; font-weight: 700;
    color: #00ffff;
    text-shadow: 0 0 12px #00ffff, 0 0 24px #00ffff88;
    letter-spacing: 1px;
  }
  #healthWrap {
    width: 200px; height: 14px; background: rgba(255,255,255,0.08);
    border-radius: 7px; overflow: hidden;
    border: 1px solid rgba(0,255,255,0.3);
    box-shadow: 0 0 15px rgba(0,255,255,0.25), inset 0 0 8px rgba(0,0,0,0.6);
  }
  #healthFill {
    height: 100%; width: 100%;
    background: linear-gradient(90deg, #00ff88, #00ffff);
    transition: width 0.15s ease-out;
    box-shadow: 0 0 12px #00ffff;
  }

  /* Overlays */
  .overlay {
    position: fixed; inset: 0; z-index: 20;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: radial-gradient(circle at center, rgba(10,10,40,0.85), rgba(0,0,0,0.95));
    backdrop-filter: blur(4px);
    color: #fff; text-align: center; padding: 20px;
  }
  .overlay h1 {
    font-size: clamp(32px, 8vw, 64px); font-weight: 900;
    color: #00ffff; letter-spacing: 4px;
    text-shadow: 0 0 20px #00ffff, 0 0 40px #00ffff88, 0 0 60px #00ffff44;
    margin-bottom: 20px;
  }
  .overlay p { font-size: 16px; color: #aaa; margin: 6px 0; }
  .overlay .score-text {
    font-size: 22px; color: #fff; margin-top: 10px;
  }
  .overlay .score-text span { color: #00ffff; font-weight: 700; }
  .overlay button {
    margin-top: 28px; padding: 14px 44px;
    font-size: 18px; font-weight: 700; font-family: inherit;
    color: #000; background: linear-gradient(135deg, #00ffff, #00ff88);
    border: none; border-radius: 50px; cursor: pointer;
    box-shadow: 0 0 25px #00ffff88, 0 0 50px #00ffff44;
    transition: transform 0.15s, box-shadow 0.15s;
    letter-spacing: 1px;
  }
  .overlay button:hover {
    transform: scale(1.06);
    box-shadow: 0 0 35px #00ffff, 0 0 70px #00ffff66;
  }
  .overlay button:active { transform: scale(0.97); }

  #gameover { display: none; }
  #startScreen h1 { font-size: clamp(28px, 7vw, 56px); }
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="hud">
  <div id="score">امتیاز: 0</div>
  <div id="healthWrap"><div id="healthFill"></div></div>
</div>

<div id="startScreen" class="overlay">
  <h1>NEON SHOOTER</h1>
  <p>با ماوس، لمس یا کلیدهای جهت‌دار حرکت کن</p>
  <p>شلیک خودکار است — از خودت محافظت کن!</p>
  <button id="startBtn">شروع بازی</button>
</div>

<div id="gameover" class="overlay">
  <h1 style="color:#ff3366; text-shadow: 0 0 20px #ff3366, 0 0 40px #ff336688;">بازی تمام شد</h1>
  <p class="score-text">امتیاز: <span id="finalScore">0</span></p>
  <p class="score-text">بهترین: <span id="bestScore">0</span></p>
  <button id="restartBtn">دوباره بازی</button>
</div>

<script>
(() => {
'use strict';

// ============================================================
//  CANVAS & RESIZE
// ============================================================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d', { alpha: false });
let W = 0, H = 0, DPR = 1;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = Math.floor(W * DPR);
  canvas.height = Math.floor(H * DPR);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
resize();
window.addEventListener('resize', resize);

// ============================================================
//  AUDIO (Web Audio API - minimal)
// ============================================================
let audioCtx = null;
function initAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){}
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}
function beep(freq, dur, type = 'sine', vol = 0.04) {
  if (!audioCtx) return;
  try {
    const t = audioCtx.currentTime;
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(t); o.stop(t + dur);
  } catch(e){}
}

// ============================================================
//  DOM REFS
// ============================================================
const $score       = document.getElementById('score');
const $healthFill  = document.getElementById('healthFill');
const $startScreen = document.getElementById('startScreen');
const $gameover    = document.getElementById('gameover');
const $finalScore  = document.getElementById('finalScore');
const $bestScore   = document.getElementById('bestScore');
const $startBtn    = document.getElementById('startBtn');
const $restartBtn  = document.getElementById('restartBtn');

let best = +(localStorage.getItem('neonBest') || 0);
$bestScore.textContent = best;

// ============================================================
//  GAME STATE
// ============================================================
const state = {
  running: false,
  gameOver: false,
  time: 0,
  score: 0,
  shake: 0,
  spawnTimer: 1,
  stars: [],
  starsFlash: 0,
};

const player = {
  x: 0, y: 0, targetX: 0, targetY: 0,
  r: 14, hp: 100,
  invuln: 0, shootCD: 0,
};

const bullets = [];
const enemyBullets = [];
const enemies = [];
const particles = [];

// ============================================================
//  INPUT
// ============================================================
const keys = {};
const pointer = { x: 0, y: 0, active: false };

window.addEventListener('keydown', e => {
  keys[e.key] = true;
  if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(e.key)) e.preventDefault();
});
window.addEventListener('keyup', e => { keys[e.key] = false; });

function setPointer(x, y) {
  pointer.x = x; pointer.y = y; pointer.active = true;
}
canvas.addEventListener('mousemove', e => setPointer(e.clientX, e.clientY));
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  const t = e.touches[0];
  setPointer(t.clientX, t.clientY);
}, { passive: false });
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  const t = e.touches[0];
  setPointer(t.clientX, t.clientY);
}, { passive: false });

// ============================================================
//  STARFIELD
// ============================================================
function initStars() {
  state.stars.length = 0;
  const count = Math.min(180, Math.floor((W * H) / 9000));
  for (let i = 0; i < count; i++) {
    state.stars.push({
      x: Math.random() * W,
      y: Math.random() * H,
      z: Math.random() * 2.5 + 0.4,
      size: Math.random() * 1.6 + 0.4,
    });
  }
}
initStars();
window.addEventListener('resize', initStars);

// ============================================================
//  PARTICLES
// ============================================================
function spawnParticles(x, y, color, count, speed, life) {
  const room = 600 - particles.length;
  if (room <= 0) return;
  count = Math.min(count, room);
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = Math.random() * speed;
    const l = life * (0.6 + Math.random() * 0.4);
    particles.push({
      x, y,
      vx: Math.cos(a) * s,
      vy: Math.sin(a) * s,
      life: l, maxLife: l,
      color,
      size: Math.random() * 2.5 + 1,
    });
  }
}

// ============================================================
//  ENEMIES
// ============================================================
function spawnEnemy() {
  const t = Math.random();
  const diff = Math.min(1, state.time / 60);
  let type;
  if (t < 0.60 - diff * 0.15) type = 'basic';
  else if (t < 0.80) type = 'zigzag';
  else if (t < 0.94) type = 'fast';
  else type = 'tank';

  const x = 40 + Math.random() * (W - 80);
  const e = {
    type, x, y: -40, dead: false, t: 0,
    hp: 1, r: 14, vy: 120, color: '#ff3366', score: 10,
  };

  if (type === 'basic') {
    e.hp = 1; e.r = 14;
    e.vy = 130 + diff * 100;
    e.color = '#ff3366'; e.score = 10;
  } else if (type === 'zigzag') {
    e.hp = 1; e.r = 14;
    e.vy = 110 + diff * 70;
    e.color = '#ffaa00'; e.score = 15;
    e.baseX = x;
    e.amp = 70 + Math.random() * 90;
    e.freq = 1.8 + Math.random() * 1.8;
  } else if (type === 'fast') {
    e.hp = 1; e.r = 10;
    e.vy = 300 + diff * 180;
    e.color = '#ff00ff'; e.score = 20;
  } else { // tank
    e.hp = 4; e.r = 24;
    e.vy = 65;
    e.color = '#00ff88'; e.score = 60;
    e.shootTimer = 1.6;
    e.shootInterval = 1.3;
  }

  enemies.push(e);
}

// ============================================================
//  GAME FLOW
// ============================================================
function startGame() {
  initAudio();
  $startScreen.style.display = 'none';
  $gameover.style.display = 'none';
  resetGame();
  state.running = true;
}

function resetGame() {
  state.score = 0;
  state.time = 0;
  state.shake = 0;
  state.spawnTimer = 0.8;
  state.gameOver = false;

  player.x = W / 2;
  player.y = H - 120;
  player.targetX = player.x;
  player.targetY = player.y;
  player.hp = 100;
  player.invuln = 1.2;
  player.shootCD = 0;

  bullets.length = 0;
  enemyBullets.length = 0;
  enemies.length = 0;
  particles.length = 0;
  pointer.active = false;

  $score.textContent = 'امتیاز: 0';
  $healthFill.style.width = '100%';
  $healthFill.style.background = 'linear-gradient(90deg, #00ff88, #00ffff)';
}

function gameOver() {
  state.running = false;
  state.gameOver = true;
  if (state.score > best) {
    best = state.score;
    localStorage.setItem('neonBest', best);
  }
  $finalScore.textContent = state.score;
  $bestScore.textContent = best;
  $gameover.style.display = 'flex';
  state.shake = 30;
  beep(120, 0.6, 'sawtooth', 0.08);
}

$startBtn.addEventListener('click', startGame);
$restartBtn.addEventListener('click', startGame);

// ============================================================
//  UPDATE
// ============================================================
function update(dt) {
  state.time += dt;
  if (state.shake > 0) state.shake = Math.max(0, state.shake - dt * 40);

  // ---------- Stars ----------
  for (const s of state.stars) {
    s.y += s.z * 45 * dt;
    if (s.y > H + 5) { s.y = -5; s.x = Math.random() * W; }
  }

  if (!state.running) return;

  // ---------- Player movement ----------
  let kx = 0, ky = 0;
  if (keys['ArrowLeft'] || keys['a'] || keys['A']) kx -= 1;
  if (keys['ArrowRight'] || keys['d'] || keys['D']) kx += 1;
  if (keys['ArrowUp'] || keys['w'] || keys['W']) ky -= 1;
  if (keys['ArrowDown'] || keys['s'] || keys['S']) ky += 1;

  if (kx || ky) {
    const len = Math.hypot(kx, ky) || 1;
    player.targetX = player.x + (kx / len) * 320;
    player.targetY = player.y + (ky / len) * 320;
  } else if (pointer.active) {
    player.targetX = pointer.x;
    player.targetY = pointer.y;
  }

  const follow = Math.min(1, dt * 16);
  player.x += (player.targetX - player.x) * follow;
  player.y += (player.targetY - player.y) * follow;

  // Clamp to screen
  const pad = player.r + 6;
  player.x = Math.max(pad, Math.min(W - pad, player.x));
  player.y = Math.max(70, Math.min(H - pad, player.y));

  // ---------- Invulnerability ----------
  if (player.invuln > 0) player.invuln -= dt;

  // ---------- Auto shooting ----------
  player.shootCD -= dt;
  if (player.shootCD <= 0) {
    player.shootCD = 0.13;
    bullets.push({ x: player.x, y: player.y - player.r, vy: -900, r: 4, dead: false });
    beep(880, 0.04, 'square', 0.015);
  }

  // ---------- Player bullets ----------
  for (const b of bullets) {
    b.y += b.vy * dt;
    if (b.y < -20) b.dead = true;
  }

  // ---------- Enemy bullets ----------
  for (const b of enemyBullets) {
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    if (b.y > H + 20 || b.x < -20 || b.x > W + 20) b.dead = true;

    if (player.invuln <= 0) {
      const dx = b.x - player.x, dy = b.y - player.y;
      const rr = player.r + b.r;
      if (dx * dx + dy * dy < rr * rr) {
        b.dead = true;
        damagePlayer(12);
      }
    }
  }

  // ---------- Spawning ----------
  state.spawnTimer -= dt;
  if (state.spawnTimer <= 0) {
    spawnEnemy();
    state.spawnTimer = Math.max(0.28, 1.15 - state.time * 0.012);
  }

  // ---------- Enemies ----------
  for (const e of enemies) {
    e.t += dt;
    e.y += e.vy * dt;

    if (e.type === 'zigzag') {
      e.x = e.baseX + Math.sin(e.t * e.freq) * e.amp;
      e.x = Math.max(e.r + 5, Math.min(W - e.r - 5, e.x));
    }

    if (e.type === 'tank') {
      e.shootTimer -= dt;
      if (e.shootTimer <= 0 && e.y > 0 && e.y < H * 0.8) {
        e.shootTimer = e.shootInterval;
        const dx = player.x - e.x;
        const dy = player.y - e.y;
        const d = Math.hypot(dx, dy) || 1;
        const sp = 260;
        enemyBullets.push({
          x: e.x, y: e.y, r: 5,
          vx: (dx / d) * sp,
          vy: (dy / d) * sp,
          dead: false,
        });
        beep(220, 0.08, 'sawtooth', 0.02);
      }
    }

    if (e.y > H + 60) e.dead = true;
  }

  // ---------- Bullets vs Enemies ----------
  for (const b of bullets) {
    if (b.dead) continue;
    for (const e of enemies) {
      if (e.dead) continue;
      const dx = e.x - b.x, dy = e.y - b.y;
      const rr = e.r + b.r;
      if (dx * dx + dy * dy < rr * rr) {
        b.dead = true;
        e.hp -= 1;
        spawnParticles(b.x, b.y, '#00ffff', 4, 140, 0.25);
        if (e.hp <= 0) {
          e.dead = true;
          state.score += e.score;
          state.shake = Math.max(state.shake, 5);
          spawnParticles(e.x, e.y, e.color, 16, 280, 0.55);
          beep(500 + Math.random() * 300, 0.08, 'square', 0.03);
        }
        break;
      }
    }
  }

  // ---------- Player vs Enemies ----------
  if (player.invuln <= 0) {
    for (const e of enemies) {
      if (e.dead) continue;
      const dx = e.x - player.x, dy = e.y - player.y;
      const rr = e.r + player.r;
      if (dx * dx + dy * dy < rr * rr) {
        e.dead = true;
        state.score += Math.floor(e.score / 2);
        spawnParticles(e.x, e.y, e.color, 14, 240, 0.5);
        damagePlayer(22);
        break;
      }
    }
  }

  // ---------- Particles ----------
  for (const p of particles) {
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vx *= 0.96;
    p.vy *= 0.96;
    p.life -= dt;
    if (p.life <= 0) p.dead = true;
  }

  // ---------- Cleanup ----------
  removeDead(bullets);
  removeDead(enemyBullets);
  removeDead(enemies);
  removeDead(particles);

  // ---------- HUD ----------
  $score.textContent = 'امتیاز: ' + state.score;
  const hp = Math.max(0, player.hp) / 100;
  $healthFill.style.width = (hp * 100) + '%';
  if (hp > 0.6) $healthFill.style.background = 'linear-gradient(90deg, #00ff88, #00ffff)';
  else if (hp > 0.3) $healthFill.style.background = 'linear-gradient(90deg, #ffaa00, #ffdd00)';
  else $healthFill.style.background = 'linear-gradient(90deg, #ff3366, #ff00ff)';
}

function removeDead(arr) {
  let j = 0;
  for (let i = 0; i < arr.length; i++) {
    if (!arr[i].dead) arr[j++] = arr[i];
  }
  arr.length = j;
}

function damagePlayer(amount) {
  player.hp -= amount;
  player.invuln = 1.0;
  state.shake = Math.max(state.shake, 14);
  spawnParticles(player.x, player.y, '#ff3366', 18, 300, 0.6);
  beep(180, 0.2, 'sawtooth', 0.06);
  if (player.hp <= 0) {
    player.hp = 0;
    spawnParticles(player.x, player.y, '#ffffff', 40, 500, 1.0);
    gameOver();
  }
}

// ============================================================
//  RENDER
// ============================================================
function render() {
  // Reset transform + screen shake
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (state.shake > 0) {
    ctx.translate(
      (Math.random() - 0.5) * state.shake,
      (Math.random() - 0.5) * state.shake
    );
  }

  // Background
  ctx.fillStyle = '#05050f';
  ctx.fillRect(-60, -60, W + 120, H + 120);

  // Nebula glow (subtle radial)
  const g = ctx.createRadialGradient(W / 2, H * 0.3, 0, W / 2, H * 0.3, Math.max(W, H) * 0.7);
  g.addColorStop(0, 'rgba(40, 20, 90, 0.35)');
  g.addColorStop(1, 'rgba(0, 0, 0, 0)');
  ctx.fillStyle = g;
  ctx.fillRect(-60, -60, W + 120, H + 120);

  // Stars
  ctx.globalCompositeOperation = 'lighter';
  for (const s of state.stars) {
    ctx.globalAlpha = Math.min(1, s.z / 2.5);
    ctx.fillStyle = '#cfe8ff';
    ctx.fillRect(s.x, s.y, s.size, s.size);
  }
  ctx.globalAlpha = 1;

  // Particles
  for (const p of particles) {
    const a = p.life / p.maxLife;
    ctx.globalAlpha = a;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';

  // Enemy bullets
  ctx.globalCompositeOperation = 'lighter';
  for (const b of enemyBullets) {
    ctx.fillStyle = '#ff00ff';
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,150,255,0.5)';
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r * 2, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';

  // Player bullets
  ctx.globalCompositeOperation = 'lighter';
  for (const b of bullets) {
    ctx.fillStyle = '#00ffff';
    ctx.fillRect(b.x - 2, b.y - 10, 4, 14);
    ctx.fillStyle = 'rgba(0,255,255,0.35)';
    ctx.fillRect(b.x - 5, b.y - 12, 10, 18);
  }
  ctx.globalCompositeOperation = 'source-over';

  // Enemies
  for (const e of enemies) drawEnemy(e);

  // Player
  if (!state.gameOver) drawPlayer();
}

function drawPlayer() {
  const { x, y, r } = player;
  ctx.save();
  ctx.translate(x, y);

  // Engine glow
  ctx.globalCompositeOperation = 'lighter';
  const eg = ctx.createRadialGradient(0, r * 0.9, 0, 0, r * 0.9, r * 2.2);
  eg.addColorStop(0, 'rgba(0,255,255,0.55)');
  eg.addColorStop(1, 'rgba(0,255,255,0)');
  ctx.fillStyle = eg;
  ctx.beginPath();
  ctx.arc(0, r * 0.9, r * 2.2, 0, Math.PI * 2);
  ctx.fill();
  ctx.globalCompositeOperation = 'source-over';

  // Blink when invulnerable
  if (player.invuln > 0 && Math.floor(player.invuln * 20) % 2 === 0) {
    ctx.globalAlpha = 0.35;
  }

  // Ship body
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.moveTo(0, -r * 1.1);
  ctx.lineTo(r * 0.85, r * 0.75);
  ctx.lineTo(r * 0.3, r * 0.5);
  ctx.lineTo(0, r * 0.9);
  ctx.lineTo(-r * 0.3, r * 0.5);
  ctx.lineTo(-r * 0.85, r * 0.75);
  ctx.closePath();
  ctx.fill();

  // Cockpit
  ctx.fillStyle = '#00ffff';
  ctx.beginPath();
  ctx.arc(0, 0, r * 0.32, 0, Math.PI * 2);
  ctx.fill();

  ctx.globalAlpha = 1;
  ctx.restore();
}

function drawEnemy(e) {
  ctx.save();
  ctx.translate(e.x, e.y);
  ctx.globalCompositeOperation = 'lighter';
  ctx.fillStyle = e.color;

  if (e.type === 'basic') {
    ctx.beginPath();
    ctx.moveTo(0, e.r);
    ctx.lineTo(e.r, -e.r * 0.7);
    ctx.lineTo(-e.r, -e.r * 0.7);
    ctx.closePath();
    ctx.fill();
  } else if (e.type === 'zigzag') {
    ctx.beginPath();
    ctx.moveTo(0, e.r);
    ctx.lineTo(e.r, 0);
    ctx.lineTo(0, -e.r);
    ctx.lineTo(-e.r, 0);
    ctx.closePath();
    ctx.fill();
  } else if (e.type === 'fast') {
    ctx.beginPath();
    ctx.arc(0, 0, e.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,150,255,0.4)';
    ctx.beginPath();
    ctx.arc(0, 0, e.r * 1.8, 0, Math.PI * 2);
    ctx.fill();
  } else if (e.type === 'tank') {
    ctx.beginPath();
    for (let i = 0; i < 6; i++) {
      const a = Math.PI / 6 + i * Math.PI / 3;
      const px = Math.cos(a) * e.r;
      const py = Math.sin(a) * e.r;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.beginPath();
    ctx.arc(0, 0, e.r * 0.5, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.globalCompositeOperation = 'source-over';

  // HP bar for multi-hp
  if (e.hp > 1) {
    const w = e.r * 2;
    const each = w / 4;
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(-e.r, -e.r - 10, w, 4);
    ctx.fillStyle = e.color;
    ctx.fillRect(-e.r, -e.r - 10, each * e.hp, 4);
  }

  ctx.restore();
}

// ============================================================
//  MAIN LOOP
// ============================================================
let last = performance.now();
function loop(now) {
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;
  update(dt);
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// Initial player position for start screen render
player.x = W / 2;
player.y = H - 120;
player.targetX = player.x;
player.targetY = player.y;

})();
</script>
</body>
</html>
