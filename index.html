<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>NEON STRIKE — FPS</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden; background: #000;
    font-family: system-ui, -apple-system, 'Segoe UI', Tahoma, sans-serif;
    user-select: none; -webkit-user-select: none; touch-action: none;
    -webkit-tap-highlight-color: transparent; cursor: crosshair;
  }
  canvas { display: block; position: fixed; inset: 0; }

  /* ============ HUD ============ */
  #hud {
    position: fixed; inset: 0; pointer-events: none; z-index: 10;
    color: #fff;
  }
  .hud-top {
    position: absolute; top: 0; left: 0; right: 0;
    padding: 14px 22px;
    display: flex; justify-content: space-between; align-items: flex-start;
  }
  #score {
    font-size: 18px; font-weight: 800; letter-spacing: 1px;
    color: #00ffff;
    text-shadow: 0 0 10px #00ffff, 0 0 22px #00ffff88;
  }
  #score .val { color: #fff; }

  .hud-bottom {
    position: absolute; bottom: 0; left: 0; right: 0;
    padding: 20px 26px;
    display: flex; justify-content: space-between; align-items: flex-end;
  }

  /* Health */
  #healthBox { width: 230px; }
  #healthLabel {
    font-size: 11px; letter-spacing: 3px; color: #00ffaa;
    text-shadow: 0 0 8px #00ffaa;
    margin-bottom: 5px; font-weight: 700;
  }
  #healthBar {
    height: 16px; background: rgba(0,0,0,0.6);
    border: 1px solid rgba(0,255,200,0.5);
    border-radius: 3px; overflow: hidden;
    box-shadow: 0 0 15px rgba(0,255,200,0.3), inset 0 0 8px rgba(0,0,0,0.8);
  }
  #healthFill {
    height: 100%; width: 100%;
    background: linear-gradient(90deg, #00ff99, #00ffdd);
    box-shadow: 0 0 14px #00ffaa;
    transition: width 0.12s, background 0.3s;
  }

  /* Ammo */
  #ammoBox {
    text-align: left;
    direction: ltr;
  }
  #ammoLabel {
    font-size: 11px; letter-spacing: 3px; color: #ffaa00;
    text-shadow: 0 0 8px #ffaa00;
    margin-bottom: 3px; font-weight: 700; text-align: right;
  }
  #ammoNum {
    font-size: 34px; font-weight: 900; line-height: 1;
    color: #ffcc00;
    text-shadow: 0 0 12px #ffaa00, 0 0 30px #ff880088;
    font-variant-numeric: tabular-nums;
  }
  #ammoNum.low { color: #ff3366; text-shadow: 0 0 12px #ff3366; }
  #ammoNum small {
    font-size: 15px; color: #888; font-weight: 700;
    text-shadow: none;
  }
  #reloadHint {
    color: #ffaa00; font-size: 12px; font-weight: 700;
    text-shadow: 0 0 8px #ffaa00;
    margin-top: 2px; opacity: 0; transition: opacity 0.2s;
    text-align: right;
  }
  #reloadHint.show { opacity: 1; animation: blink 0.6s infinite alternate; }
  @keyframes blink { from { opacity: 1; } to { opacity: 0.3; } }

  /* Kill feed / wave info */
  #waveInfo {
    position: absolute; top: 56px; left: 50%; transform: translateX(-50%);
    font-size: 12px; letter-spacing: 2px; color: #88aaff;
    text-shadow: 0 0 8px #4466ff;
  }

  /* ============ Overlays ============ */
  .overlay {
    position: fixed; inset: 0; z-index: 30;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: radial-gradient(circle, rgba(10,10,30,0.82) 0%, rgba(0,0,0,0.96) 100%);
    backdrop-filter: blur(3px);
    color: #fff; text-align: center; padding: 24px;
    cursor: default;
  }
  .overlay h1 {
    font-size: clamp(36px, 9vw, 76px); font-weight: 900;
    letter-spacing: 6px; margin-bottom: 8px;
    color: #00ffff;
    text-shadow: 0 0 24px #00ffff, 0 0 48px #00ffff88, 0 0 80px #00ffff44;
  }
  .overlay h2 {
    font-size: clamp(20px, 5vw, 32px); font-weight: 800;
    letter-spacing: 3px; color: #fff; margin-bottom: 16px;
  }
  .overlay .sub {
    font-size: 14px; color: #99aabb; letter-spacing: 1px;
    margin-bottom: 4px;
  }
  .controls {
    display: grid; grid-template-columns: auto auto;
    gap: 8px 20px; margin: 26px 0 8px;
    padding: 18px 26px;
    background: rgba(0,255,255,0.05);
    border: 1px solid rgba(0,255,255,0.2);
    border-radius: 10px;
    font-size: 13px; text-align: right;
  }
  .controls .k {
    color: #00ffff; font-weight: 800; letter-spacing: 1px;
    text-align: left; direction: ltr;
  }
  .controls .v { color: #ccddee; }
  .overlay button {
    margin-top: 22px; padding: 15px 54px;
    font-size: 18px; font-weight: 800; font-family: inherit;
    letter-spacing: 2px;
    color: #000;
    background: linear-gradient(135deg, #00ffff, #00ff88);
    border: none; border-radius: 60px; cursor: pointer;
    box-shadow: 0 0 28px #00ffff88, 0 0 60px #00ffff44;
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .overlay button:hover { transform: scale(1.06); box-shadow: 0 0 38px #00ffff, 0 0 80px #00ffff66; }
  .overlay button:active { transform: scale(0.96); }

  .stat-row {
    display: flex; gap: 40px; margin: 18px 0 6px;
    justify-content: center;
  }
  .stat-row .lbl { font-size: 12px; color: #8899aa; letter-spacing: 2px; }
  .stat-row .num {
    font-size: 30px; font-weight: 900; color: #fff;
    text-shadow: 0 0 15px #00ffff88;
    font-variant-numeric: tabular-nums;
  }

  #gameover h1 { color: #ff3366; text-shadow: 0 0 24px #ff3366, 0 0 48px #ff336688; }
  #pauseScreen h1 { font-size: clamp(28px, 6vw, 52px); color: #ffaa00; text-shadow: 0 0 24px #ffaa00; }

  #gameover, #pauseScreen { display: none; }

  /* Damage vignette */
  #damageVignette {
    position: fixed; inset: 0; pointer-events: none; z-index: 15;
    opacity: 0;
    background: radial-gradient(circle, transparent 40%, rgba(255,0,50,0.7) 100%);
    transition: opacity 0.35s;
  }
  #lowHealthVignette {
    position: fixed; inset: 0; pointer-events: none; z-index: 14;
    opacity: 0;
    background: radial-gradient(circle, transparent 50%, rgba(255,0,30,0.55) 100%);
    transition: opacity 0.4s;
  }
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="damageVignette"></div>
<div id="lowHealthVignette"></div>

<div id="hud">
  <div class="hud-top">
    <div id="score">SCORE <span class="val">0</span></div>
    <div id="waveInfo">—</div>
  </div>
  <div class="hud-bottom">
    <div id="healthBox">
      <div id="healthLabel">HEALTH</div>
      <div id="healthBar"><div id="healthFill"></div></div>
    </div>
    <div id="ammoBox">
      <div id="ammoLabel">AMMO</div>
      <div id="ammoNum">30<small>/30</small></div>
      <div id="reloadHint">PRESS R TO RELOAD</div>
    </div>
  </div>
</div>

<div id="startScreen" class="overlay">
  <h1>NEON STRIKE</h1>
  <p class="sub">شوتر اول‌شخص — از خودت دفاع کن</p>
  <div class="controls">
    <span class="k">W A S D</span><span class="v">حرکت</span>
    <span class="k">MOUSE</span><span class="v">چرخش دید</span>
    <span class="k">CLICK</span><span class="v">شلیک</span>
    <span class="k">R</span><span class="v">خشاب‌گذاری</span>
    <span class="k">SHIFT</span><span class="v">دویدن</span>
    <span class="k">ESC</span><span class="v">توقف</span>
  </div>
  <button id="startBtn">شروع بازی</button>
</div>

<div id="gameover" class="overlay">
  <h2>YOU DIED</h2>
  <h1>GAME OVER</h1>
  <div class="stat-row">
    <div>
      <div class="lbl">SCORE</div>
      <div class="num" id="finalScore">0</div>
    </div>
    <div>
      <div class="lbl">KILLS</div>
      <div class="num" id="finalKills">0</div>
    </div>
    <div>
      <div class="lbl">BEST</div>
      <div class="num" id="bestScore">0</div>
    </div>
  </div>
  <button id="restartBtn">بازی مجدد</button>
</div>

<div id="pauseScreen" class="overlay">
  <h1>PAUSED</h1>
  <p class="sub">برای ادامه کلیک کن</p>
  <button id="resumeBtn">ادامه</button>
</div>

<script>
(() => {
'use strict';

// ════════════════════════════════════════════════════════════
//  MAP
// ════════════════════════════════════════════════════════════
const MAP_STR = [
  "111111111111111111111111",
  "100000000000000000000001",
  "100000000000000000000001",
  "100033000000000000330001",
  "100033000000000000330001",
  "100000000000000000000001",
  "100000000000000000000001",
  "100000000022000000000001",
  "100000000022000000000001",
  "100000000000000000000001",
  "100000000000000000000001",
  "100033000000000000330001",
  "100033000000000000330001",
  "100000000000000000000001",
  "100000000000000000000001",
  "100000000022000000000001",
  "100000000022000000000001",
  "100000000000000000000001",
  "100000000000000000000001",
  "100033000000000000330001",
  "100033000000000000330001",
  "100000000000000000000001",
  "100000000000000000000001",
  "111111111111111111111111",
];

const GRID = MAP_STR.map(row => {
  const arr = new Uint8Array(row.length);
  for (let i = 0; i < row.length; i++) arr[i] = row.charCodeAt(i) - 48;
  return arr;
});
const MW = GRID[0].length;
const MH = GRID.length;
const TAU = Math.PI * 2;

function isWall(x, y) {
  if (x < 0 || y < 0 || x >= MW || y >= MH) return true;
  return GRID[y | 0][x | 0] > 0;
}

// ════════════════════════════════════════════════════════════
//  CANVAS SETUP
// ════════════════════════════════════════════════════════════
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d', { alpha: false });
const buf = document.createElement('canvas');
const bctx = buf.getContext('2d', { alpha: false });

let W = 0, H = 0, DPR = 1;
let RW = 720, RH = 405;
let zbuf = new Float32Array(RW);

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = Math.floor(W * DPR);
  canvas.height = Math.floor(H * DPR);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'low';

  // internal render resolution
  const targetW = Math.min(760, Math.max(360, Math.round(W * 0.58)));
  RW = targetW;
  RH = Math.round(RW * H / W);
  if (RH > 640) { RH = 640; RW = Math.round(RH * W / H); }
  buf.width = RW;
  buf.height = RH;
  zbuf = new Float32Array(RW);
}
resize();
window.addEventListener('resize', resize);

// ════════════════════════════════════════════════════════════
//  WALL COLOR LUT (precomputed for perf)
// ════════════════════════════════════════════════════════════
const FOG_STEPS = 72;
const MAX_VIEW_DIST = 22;
const WALL_RGB = [
  null,
  [40, 220, 255],   // 1 = cyan base
  [255, 60, 170],   // 2 = magenta pillar
  [120, 255, 130],  // 3 = green pillar
];
const LUT = [];
for (let t = 1; t < WALL_RGB.length; t++) {
  const [r, g, b] = WALL_RGB[t];
  LUT[t] = [[], []];
  for (let side = 0; side < 2; side++) {
    const sm = side ? 0.68 : 1;
    for (let i = 0; i < FOG_STEPS; i++) {
      const f = 1 - (i / FOG_STEPS) * 0.9;
      LUT[t][side].push(
        `rgb(${(r * f * sm) | 0},${(g * f * sm) | 0},${(b * f * sm) | 0})`
      );
    }
  }
}

// ════════════════════════════════════════════════════════════
//  AUDIO
// ════════════════════════════════════════════════════════════
let actx = null;
let noiseBuf = null;

function initAudio() {
  if (actx) { if (actx.state === 'suspended') actx.resume(); return; }
  try {
    actx = new (window.AudioContext || window.webkitAudioContext)();
    const len = Math.floor(actx.sampleRate * 0.15);
    noiseBuf = actx.createBuffer(1, len, actx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  } catch (e) { actx = null; }
}

function sfxShot() {
  if (!actx || !noiseBuf) return;
  const t = actx.currentTime;
  const src = actx.createBufferSource();
  src.buffer = noiseBuf;
  const flt = actx.createBiquadFilter();
  flt.type = 'lowpass'; flt.frequency.value = 1400;
  const g = actx.createGain();
  g.gain.setValueAtTime(0.22, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
  src.connect(flt); flt.connect(g); g.connect(actx.destination);
  src.start(t); src.stop(t + 0.15);

  // low thump
  const o = actx.createOscillator();
  const og = actx.createGain();
  o.type = 'sine'; o.frequency.setValueAtTime(120, t);
  o.frequency.exponentialRampToValueAtTime(45, t + 0.08);
  og.gain.setValueAtTime(0.18, t);
  og.gain.exponentialRampToValueAtTime(0.001, t + 0.09);
  o.connect(og); og.connect(actx.destination);
  o.start(t); o.stop(t + 0.1);
}

function sfxHit() {
  if (!actx) return;
  const t = actx.currentTime;
  const o = actx.createOscillator();
  const g = actx.createGain();
  o.type = 'square'; o.frequency.setValueAtTime(620, t);
  o.frequency.exponentialRampToValueAtTime(220, t + 0.06);
  g.gain.setValueAtTime(0.05, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.07);
  o.connect(g); g.connect(actx.destination);
  o.start(t); o.stop(t + 0.08);
}

function sfxEnemyDie() {
  if (!actx) return;
  const t = actx.currentTime;
  const o = actx.createOscillator();
  const g = actx.createGain();
  o.type = 'sawtooth'; o.frequency.setValueAtTime(320, t);
  o.frequency.exponentialRampToValueAtTime(60, t + 0.3);
  g.gain.setValueAtTime(0.08, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.32);
  o.connect(g); g.connect(actx.destination);
  o.start(t); o.stop(t + 0.34);
}

function sfxHurt() {
  if (!actx) return;
  const t = actx.currentTime;
  const o = actx.createOscillator();
  const g = actx.createGain();
  o.type = 'sawtooth'; o.frequency.setValueAtTime(180, t);
  o.frequency.exponentialRampToValueAtTime(70, t + 0.22);
  g.gain.setValueAtTime(0.1, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.24);
  o.connect(g); g.connect(actx.destination);
  o.start(t); o.stop(t + 0.25);
}

function sfxReload() {
  if (!actx) return;
  const t = actx.currentTime;
  for (let i = 0; i < 3; i++) {
    const o = actx.createOscillator();
    const g = actx.createGain();
    o.type = 'square';
    o.frequency.value = [280, 380, 500][i];
    g.gain.setValueAtTime(0.04, t + i * 0.09);
    g.gain.exponentialRampToValueAtTime(0.001, t + i * 0.09 + 0.05);
    o.connect(g); g.connect(actx.destination);
    o.start(t + i * 0.09); o.stop(t + i * 0.09 + 0.06);
  }
}

function sfxEnemyShoot() {
  if (!actx) return;
  const t = actx.currentTime;
  const o = actx.createOscillator();
  const g = actx.createGain();
  o.type = 'triangle'; o.frequency.setValueAtTime(400, t);
  o.frequency.exponentialRampToValueAtTime(150, t + 0.12);
  g.gain.setValueAtTime(0.03, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.13);
  o.connect(g); g.connect(actx.destination);
  o.start(t); o.stop(t + 0.14);
}

// ════════════════════════════════════════════════════════════
//  GAME STATE
// ════════════════════════════════════════════════════════════
const state = {
  phase: 'menu',          // menu | playing | paused | dead
  time: 0,
  score: 0,
  kills: 0,
  shake: 0,
  damageFlash: 0,
  spawnTimer: 2,
  bestScore: +(localStorage.getItem('neonStrikeBest') || 0),
};

const player = {
  x: 12.5, y: 12.5, angle: 0,
  hp: 100, ammo: 30, magSize: 30,
  fireCD: 0, reloadTimer: 0, reloading: false,
  muzzle: 0, recoil: 0, bob: 0, lastHit: -99,
  keyTurn: 0,
};

const enemies = [];
const enemyBullets = [];
const hitParticles = [];

// ════════════════════════════════════════════════════════════
//  INPUT
// ════════════════════════════════════════════════════════════
const keys = Object.create(null);
let mouseDown = false;
const SENS = 0.0022;

window.addEventListener('keydown', e => {
  if ([' ', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) e.preventDefault();
  keys[e.key.toLowerCase()] = true;
  if (e.key.toLowerCase() === 'r') tryReload();
  if (e.key === 'Escape' && state.phase === 'playing') pauseGame();
});
window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

canvas.addEventListener('mousedown', e => {
  if (e.button === 0) mouseDown = true;
});
window.addEventListener('mouseup', e => {
  if (e.button === 0) mouseDown = false;
});

document.addEventListener('mousemove', e => {
  if (document.pointerLockElement === canvas && state.phase === 'playing') {
    player.angle += e.movementX * SENS;
    if (player.angle > Math.PI) player.angle -= TAU;
    if (player.angle < -Math.PI) player.angle += TAU;
  }
});

document.addEventListener('pointerlockchange', () => {
  if (state.phase === 'playing' && document.pointerLockElement !== canvas) {
    pauseGame();
  }
});

// ════════════════════════════════════════════════════════════
//  UI REFS
// ════════════════════════════════════════════════════════════
const $score      = document.querySelector('#score .val');
const $healthFill = document.getElementById('healthFill');
const $ammoNum    = document.getElementById('ammoNum');
const $reloadHint = document.getElementById('reloadHint');
const $waveInfo   = document.getElementById('waveInfo');
const $damageVig  = document.getElementById('damageVignette');
const $lowHealth  = document.getElementById('lowHealthVignette');

const $startScreen = document.getElementById('startScreen');
const $gameover    = document.getElementById('gameover');
const $pauseScreen = document.getElementById('pauseScreen');
const $finalScore  = document.getElementById('finalScore');
const $finalKills  = document.getElementById('finalKills');
const $bestScore   = document.getElementById('bestScore');

document.getElementById('startBtn').addEventListener('click', startGame);
document.getElementById('restartBtn').addEventListener('click', startGame);
document.getElementById('resumeBtn').addEventListener('click', resumeGame);

function updateHUD() {
  $score.textContent = state.score;
  const p = Math.max(0, player.hp);
  $healthFill.style.width = p + '%';
  if (p > 60) $healthFill.style.background = 'linear-gradient(90deg,#00ff99,#00ffdd)';
  else if (p > 30) $healthFill.style.background = 'linear-gradient(90deg,#ffaa00,#ffdd00)';
  else $healthFill.style.background = 'linear-gradient(90deg,#ff3366,#ff00aa)';

  $ammoNum.innerHTML = player.ammo + '<small>/' + player.magSize + '</small>';
  $ammoNum.classList.toggle('low', player.ammo <= 5);
  $reloadHint.classList.toggle('show', player.ammo === 0 && !player.reloading);
}

// ════════════════════════════════════════════════════════════
//  GAME FLOW
// ════════════════════════════════════════════════════════════
function startGame() {
  initAudio();
  $startScreen.style.display = 'none';
  $gameover.style.display = 'none';
  $pauseScreen.style.display = 'none';
  resetGame();
  state.phase = 'playing';
  canvas.requestPointerLock && canvas.requestPointerLock();
}

function resumeGame() {
  $pauseScreen.style.display = 'none';
  state.phase = 'playing';
  canvas.requestPointerLock && canvas.requestPointerLock();
}

function pauseGame() {
  if (state.phase !== 'playing') return;
  state.phase = 'paused';
  $pauseScreen.style.display = 'flex';
  if (document.pointerLockElement) document.exitPointerLock();
}

function resetGame() {
  state.time = 0;
  state.score = 0;
  state.kills = 0;
  state.shake = 0;
  state.damageFlash = 0;
  state.spawnTimer = 1.5;

  player.x = 12.5; player.y = 12.5; player.angle = 0;
  player.hp = 100; player.ammo = 30;
  player.fireCD = 0; player.reloading = false; player.reloadTimer = 0;
  player.muzzle = 0; player.recoil = 0; player.bob = 0;
  player.lastHit = -99;

  enemies.length = 0;
  enemyBullets.length = 0;
  hitParticles.length = 0;

  updateHUD();
  $waveInfo.textContent = '—';
}

function killPlayer() {
  state.phase = 'dead';
  if (document.pointerLockElement) document.exitPointerLock();
  if (state.score > state.bestScore) {
    state.bestScore = state.score;
    localStorage.setItem('neonStrikeBest', state.bestScore);
  }
  $finalScore.textContent = state.score;
  $finalKills.textContent = state.kills;
  $bestScore.textContent = state.bestScore;
  $gameover.style.display = 'flex';
  state.shake = 25;
}

// ════════════════════════════════════════════════════════════
//  PLAYER ACTIONS
// ════════════════════════════════════════════════════════════
function tryReload() {
  if (state.phase !== 'playing') return;
  if (player.reloading || player.ammo === player.magSize) return;
  player.reloading = true;
  player.reloadTimer = 1.15;
  sfxReload();
}

function shoot() {
  if (player.reloading || player.fireCD > 0) return;
  if (player.ammo <= 0) { tryReload(); return; }

  player.ammo--;
  player.fireCD = 0.095;
  player.muzzle = 0.07;
  player.recoil = 1;
  state.shake = Math.max(state.shake, 4);
  sfxShot();

  const dirX = Math.cos(player.angle);
  const dirY = Math.sin(player.angle);

  // find closest enemy in center of screen with LOS
  let best = null, bestDist = Infinity;
  for (const e of enemies) {
    if (e.dead) continue;
    const dx = e.x - player.x, dy = e.y - player.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist > 25) continue;
    let angTo = Math.atan2(dy, dx) - player.angle;
    while (angTo > Math.PI) angTo -= TAU;
    while (angTo < -Math.PI) angTo += TAU;
    const angRadius = Math.atan2(e.r, dist);
    if (Math.abs(angTo) < angRadius + 0.02 && dist < bestDist) {
      if (hasLOS(player.x, player.y, e.x, e.y)) {
        bestDist = dist; best = e;
      }
    }
  }

  if (best) {
    best.hp -= 1;
    best.flash = 0.09;
    sfxHit();
    hitParticles.push({ life: 0.25, max: 0.25 });
    if (best.hp <= 0) {
      best.dead = true;
      state.kills++;
      state.score += best.scoreValue;
      state.shake = Math.max(state.shake, 7);
      sfxEnemyDie();
    }
  }

  if (player.ammo === 0) tryReload();
  updateHUD();
}

function damagePlayer(amount) {
  if (state.phase !== 'playing') return;
  player.hp -= amount;
  player.lastHit = state.time;
  state.damageFlash = 1;
  state.shake = Math.max(state.shake, 10);
  sfxHurt();
  if (player.hp <= 0) {
    player.hp = 0;
    killPlayer();
  }
  updateHUD();
}

// ════════════════════════════════════════════════════════════
//  ENEMIES
// ════════════════════════════════════════════════════════════
function spawnEnemy() {
  const diff = Math.min(1, state.time / 100);
  let ex = 0, ey = 0, ok = false;
  for (let t = 0; t < 40; t++) {
    ex = 2 + Math.random() * (MW - 4);
    ey = 2 + Math.random() * (MH - 4);
    if (isWall(ex, ey)) continue;
    const d = Math.hypot(ex - player.x, ey - player.y);
    if (d < 7) continue;
    ok = true; break;
  }
  if (!ok) return;

  enemies.push({
    x: ex, y: ey, r: 0.42,
    hp: 2 + Math.floor(diff * 2),
    maxHp: 2 + Math.floor(diff * 2),
    speed: 1.3 + diff * 1.1,
    fireRate: 2.4 - diff * 1.2,
    shootTimer: 1 + Math.random() * 1.5,
    t: Math.random() * 10,
    flash: 0,
    scoreValue: 15,
    dead: false,
  });
}

// line-of-sight check
function hasLOS(x0, y0, x1, y1) {
  const dx = x1 - x0, dy = y1 - y0;
  const dist = Math.hypot(dx, dy);
  const steps = Math.min(60, Math.ceil(dist * 6));
  for (let i = 1; i < steps; i++) {
    const t = i / steps;
    if (isWall(x0 + dx * t, y0 + dy * t)) return false;
  }
  return true;
}

// collision with radius (for entities)
function blockedAt(x, y, r) {
  return isWall(x - r, y - r) || isWall(x + r, y - r) ||
         isWall(x - r, y + r) || isWall(x + r, y + r);
}

// ════════════════════════════════════════════════════════════
//  UPDATE
// ════════════════════════════════════════════════════════════
function update(dt) {
  state.time += dt;

  // screen shake decay
  if (state.shake > 0) state.shake = Math.max(0, state.shake - dt * 45);
  // damage flash decay
  if (state.damageFlash > 0) state.damageFlash = Math.max(0, state.damageFlash - dt * 2.5);
  $damageVig.style.opacity = state.damageFlash * 0.85;

  if (state.phase !== 'playing') return;

  // ── player movement ──
  const dirX = Math.cos(player.angle);
  const dirY = Math.sin(player.angle);
  const rightX = -dirY, rightY = dirX;

  let mx = 0, my = 0;
  if (keys['w'] || keys['arrowup'])    { mx += dirX;  my += dirY; }
  if (keys['s'] || keys['arrowdown'])  { mx -= dirX;  my -= dirY; }
  if (keys['d'])                       { mx += rightX; my += rightY; }
  if (keys['a'])                       { mx -= rightX; my -= rightY; }

  // keyboard turning (fallback when no mouse)
  let turn = 0;
  if (keys['arrowright']) turn += 1;
  if (keys['arrowleft'])  turn -= 1;
  if (turn) player.angle += turn * 2.2 * dt;

  const moving = mx !== 0 || my !== 0;
  if (moving) {
    const len = Math.hypot(mx, my);
    mx /= len; my /= len;
    const sprint = (keys['shift'] ? 1.65 : 1);
    const speed = 4.2 * sprint * dt;
    const r = 0.24;
    const nx = player.x + mx * speed;
    const ny = player.y + my * speed;
    if (!blockedAt(nx, player.y, r)) player.x = nx;
    if (!blockedAt(player.x, ny, r)) player.y = ny;
    player.bob += dt * 11 * sprint;
  } else {
    player.bob += dt * 1.5;
  }

  // ── timers ──
  if (player.fireCD > 0) player.fireCD -= dt;
  if (player.muzzle > 0) player.muzzle = Math.max(0, player.muzzle - dt * 12);
  if (player.recoil > 0) player.recoil = Math.max(0, player.recoil - dt * 6);

  if (player.reloading) {
    player.reloadTimer -= dt;
    if (player.reloadTimer <= 0) {
      player.reloading = false;
      player.ammo = player.magSize;
      updateHUD();
    }
  }

  // ── shooting ──
  if (mouseDown) shoot();

  // ── health regen after 5s ──
  if (player.hp > 0 && player.hp < 100 && state.time - player.lastHit > 5) {
    player.hp = Math.min(100, player.hp + 9 * dt);
    updateHUD();
  }
  $lowHealth.style.opacity = player.hp < 35 ? (0.35 + Math.sin(state.time * 6) * 0.15) : 0;

  // ── spawning ──
  const diff = Math.min(1, state.time / 100);
  state.spawnTimer -= dt;
  const maxEnemies = 4 + Math.floor(diff * 14);
  if (state.spawnTimer <= 0 && enemies.length < maxEnemies) {
    spawnEnemy();
    state.spawnTimer = Math.max(0.7, 2.4 - diff * 1.6);
  }
  $waveInfo.textContent = 'HOSTILES ' + enemies.length + '  ·  T+' + Math.floor(state.time) + 's';

  // ── enemies AI ──
  for (const e of enemies) {
    if (e.dead) continue;
    e.t += dt;
    if (e.flash > 0) e.flash = Math.max(0, e.flash - dt * 8);

    const dx = player.x - e.x;
    const dy = player.y - e.y;
    const dist = Math.hypot(dx, dy) || 0.001;

    // move toward player
    if (dist > 2.0) {
      const nx = dx / dist, ny = dy / dist;
      const spd = e.speed * dt;
      const r = 0.35;
      const tx = e.x + nx * spd;
      const ty = e.y + ny * spd;
      if (!blockedAt(tx, e.y, r)) e.x = tx;
      else if (!blockedAt(e.x, e.y + ny * spd, r)) e.y += ny * spd;
      if (!blockedAt(e.x, ty, r)) e.y = ty;
      else if (!blockedAt(e.x + nx * spd, e.y, r)) e.x += nx * spd;
    }

    // contact damage
    if (dist < 0.75) {
      damagePlayer(14 * dt);
      // push back
      e.x -= (dx / dist) * 0.04;
      e.y -= (dy / dist) * 0.04;
    }

    // shoot
    e.shootTimer -= dt;
    if (e.shootTimer <= 0 && dist < 14 && hasLOS(e.x, e.y, player.x, player.y)) {
      e.shootTimer = e.fireRate + Math.random() * 0.7;
      const spd = 6.0;
      enemyBullets.push({
        x: e.x, y: e.y,
        vx: (dx / dist) * spd,
        vy: (dy / dist) * spd,
        dead: false, t: 0,
      });
      sfxEnemyShoot();
    }
  }

  // ── enemy bullets ──
  for (const b of enemyBullets) {
    if (b.dead) continue;
    b.t += dt;
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    if (b.t > 5 || isWall(b.x, b.y)) { b.dead = true; continue; }
    const dx = b.x - player.x, dy = b.y - player.y;
    if (dx * dx + dy * dy < 0.42 * 0.42) {
      b.dead = true;
      damagePlayer(11);
    }
  }

  // ── particles (screen hit markers) ──
  for (const p of hitParticles) {
    p.life -= dt;
    if (p.life <= 0) p.dead = true;
  }

  // ── cleanup ──
  let j = 0;
  for (let i = 0; i < enemies.length; i++) if (!enemies[i].dead) enemies[j++] = enemies[i];
  enemies.length = j;
  j = 0;
  for (let i = 0; i < enemyBullets.length; i++) if (!enemyBullets[i].dead) enemyBullets[j++] = enemyBullets[i];
  enemyBullets.length = j;
  j = 0;
  for (let i = 0; i < hitParticles.length; i++) if (!hitParticles[i].dead) hitParticles[j++] = hitParticles[i];
  hitParticles.length = j;
}

// ════════════════════════════════════════════════════════════
//  RENDER — SCENE (raycasting into buffer)
// ════════════════════════════════════════════════════════════
const PLANE_LEN = 0.78;

function renderScene() {
  const dirX = Math.cos(player.angle);
  const dirY = Math.sin(player.angle);
  const planeX = -dirY * PLANE_LEN;
  const planeY = dirX * PLANE_LEN;
  const px = player.x, py = player.y;

  // ── ceiling ──
  const cg = bctx.createLinearGradient(0, 0, 0, RH * 0.5);
  cg.addColorStop(0, '#05060f');
  cg.addColorStop(1, '#141033');
  bctx.fillStyle = cg;
  bctx.fillRect(0, 0, RW, RH * 0.5);

  // ── floor ──
  const fg = bctx.createLinearGradient(0, RH * 0.5, 0, RH);
  fg.addColorStop(0, '#14102a');
  fg.addColorStop(1, '#030308');
  bctx.fillStyle = fg;
  bctx.fillRect(0, RH * 0.5, RW, RH * 0.5);

  // horizon glow
  bctx.fillStyle = 'rgba(80, 40, 160, 0.25)';
  bctx.fillRect(0, RH * 0.5 - 2, RW, 4);

  // ── walls (DDA per column) ──
  for (let x = 0; x < RW; x++) {
    const cameraX = 2 * x / RW - 1;
    const rdX = dirX + planeX * cameraX;
    const rdY = dirY + planeY * cameraX;

    let mapX = px | 0;
    let mapY = py | 0;

    const ddX = rdX === 0 ? 1e30 : Math.abs(1 / rdX);
    const ddY = rdY === 0 ? 1e30 : Math.abs(1 / rdY);

    let stepX, stepY, sideDistX, sideDistY;
    if (rdX < 0) { stepX = -1; sideDistX = (px - mapX) * ddX; }
    else         { stepX =  1; sideDistX = (mapX + 1 - px) * ddX; }
    if (rdY < 0) { stepY = -1; sideDistY = (py - mapY) * ddY; }
    else         { stepY =  1; sideDistY = (mapY + 1 - py) * ddY; }

    let side = 0, tile = 0;
    for (let iter = 0; iter < 100; iter++) {
      if (sideDistX < sideDistY) { sideDistX += ddX; mapX += stepX; side = 0; }
      else                        { sideDistY += ddY; mapY += stepY; side = 1; }
      if (mapX < 0 || mapY < 0 || mapX >= MW || mapY >= MH) { tile = 1; break; }
      tile = GRID[mapY][mapX];
      if (tile > 0) break;
    }

    const perp = side === 0 ? (sideDistX - ddX) : (sideDistY - ddY);
    zbuf[x] = perp;

    const lineH = RH / perp;
    const drawStart = (RH - lineH) * 0.5;

    let fog = (perp / MAX_VIEW_DIST * FOG_STEPS) | 0;
    if (fog < 0) fog = 0;
    else if (fog >= FOG_STEPS) fog = FOG_STEPS - 1;

    bctx.fillStyle = LUT[tile][side][fog];
    bctx.fillRect(x, drawStart, 1, lineH);
  }

  // ── sprite collection & sorting ──
  const sprites = [];
  for (const e of enemies) {
    const dx = e.x - px, dy = e.y - py;
    sprites.push({ t: 0, x: e.x, y: e.y, d: dx * dx + dy * dy, ref: e });
  }
  for (const b of enemyBullets) {
    const dx = b.x - px, dy = b.y - py;
    sprites.push({ t: 1, x: b.x, y: b.y, d: dx * dx + dy * dy, ref: b });
  }
  sprites.sort((a, b) => b.d - a.d);

  const invDet = 1 / (planeX * dirY - dirX * planeY);

  for (const s of sprites) {
    const sx = s.x - px;
    const sy = s.y - py;
    const tx = invDet * (dirY * sx - dirX * sy);
    const ty = invDet * (-planeY * sx + planeX * sy);

    if (ty <= 0.15) continue;

    const screenX = (RW * 0.5) * (1 + tx / ty);
    if (screenX < -100 || screenX > RW + 100) continue;

    const col = screenX | 0;
    if (col >= 0 && col < RW && ty >= zbuf[col]) continue;

    const projSize = RH / ty;

    if (s.t === 0) {
      // enemy drone
      const e = s.ref;
      const size = projSize * 0.36;
      const cx = screenX;
      const cy = RH * 0.5;
      const rot = e.t * 1.5;
      const fog = Math.max(0, 1 - ty / MAX_VIEW_DIST);
      drawDrone(cx, cy, size, rot, e.flash > 0, fog);
    } else {
      // enemy bullet
      const b = s.ref;
      const size = projSize * 0.11;
      const cx = screenX;
      const cy = RH * 0.5;
      bctx.globalCompositeOperation = 'lighter';
      bctx.fillStyle = 'rgba(255,180,40,0.35)';
      bctx.beginPath();
      bctx.arc(cx, cy, size * 2.2, 0, TAU);
      bctx.fill();
      bctx.fillStyle = '#ffcc33';
      bctx.beginPath();
      bctx.arc(cx, cy, size, 0, TAU);
      bctx.fill();
      bctx.fillStyle = '#ffffff';
      bctx.beginPath();
      bctx.arc(cx, cy, size * 0.45, 0, TAU);
      bctx.fill();
      bctx.globalCompositeOperation = 'source-over';
    }
  }
}

function drawDrone(cx, cy, size, rot, flash, fog) {
  if (size < 1.2) return;
  const alpha = 0.35 + fog * 0.65;
  bctx.save();
  bctx.translate(cx, cy);
  bctx.globalCompositeOperation = 'lighter';

  // outer glow
  bctx.fillStyle = flash
    ? `rgba(255,255,255,${0.55 * alpha})`
    : `rgba(255,50,110,${0.28 * alpha})`;
  bctx.beginPath();
  bctx.arc(0, 0, size * 1.15, 0, TAU);
  bctx.fill();

  // hexagon ring
  bctx.strokeStyle = flash ? '#ffffff' : `rgba(255,60,120,${alpha})`;
  bctx.lineWidth = Math.max(1, size * 0.1);
  bctx.beginPath();
  for (let i = 0; i < 6; i++) {
    const a = rot + i * TAU / 6;
    const px = Math.cos(a) * size * 0.7;
    const py = Math.sin(a) * size * 0.7;
    if (i === 0) bctx.moveTo(px, py); else bctx.lineTo(px, py);
  }
  bctx.closePath();
  bctx.stroke();

  // core
  bctx.fillStyle = flash ? '#ffffff' : `rgba(255,120,180,${alpha})`;
  bctx.beginPath();
  bctx.arc(0, 0, size * 0.32, 0, TAU);
  bctx.fill();

  // eye
  bctx.fillStyle = `rgba(255,255,255,${alpha})`;
  bctx.beginPath();
  bctx.arc(0, 0, size * 0.14, 0, TAU);
  bctx.fill();

  bctx.restore();
  bctx.globalCompositeOperation = 'source-over';
}

// ════════════════════════════════════════════════════════════
//  RENDER — MAIN (composition)
// ════════════════════════════════════════════════════════════
function render() {
  // shake offset applied to ctx
  let shX = 0, shY = 0;
  if (state.shake > 0.2) {
    shX = (Math.random() - 0.5) * state.shake;
    shY = (Math.random() - 0.5) * state.shake;
  }

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  ctx.translate(shX, shY);

  // draw the low-res buffer scaled up
  ctx.drawImage(buf, 0, 0, W, H);

  // weapon + crosshair only during play
  if (state.phase === 'playing' || state.phase === 'paused') {
    drawWeapon();
    drawCrosshair();
  }

  // minimap
  if (state.phase === 'playing' || state.phase === 'paused') {
    drawMinimap();
  }

  ctx.restore();

  // vignette (always)
  const vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.max(W, H) * 0.75);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,0.55)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, W, H);
}

// ── weapon ──
function drawWeapon() {
  const bobX = Math.sin(player.bob) * 6;
  const bobY = Math.abs(Math.cos(player.bob)) * 5;
  const recoilY = player.recoil * 22;
  const reloadY = player.reloading
    ? Math.sin((1.15 - player.reloadTimer) / 1.15 * Math.PI) * 90
    : 0;

  const cx = W / 2 + bobX + 40;
  const cy = H + bobY + recoilY + reloadY;

  ctx.save();
  ctx.translate(cx, cy);

  // ── grip / shadow ──
  ctx.fillStyle = '#080a14';
  ctx.beginPath();
  ctx.moveTo(-95, 0);
  ctx.lineTo(-55, -175);
  ctx.lineTo(75, -175);
  ctx.lineTo(115, 0);
  ctx.closePath();
  ctx.fill();

  // ── main body ──
  const g = ctx.createLinearGradient(-55, -175, 75, 0);
  g.addColorStop(0, '#2a3550');
  g.addColorStop(0.5, '#1a2236');
  g.addColorStop(1, '#0d1220');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(-70, 0);
  ctx.lineTo(-45, -150);
  ctx.lineTo(-20, -170);
  ctx.lineTo(50, -170);
  ctx.lineTo(80, -150);
  ctx.lineTo(95, 0);
  ctx.closePath();
  ctx.fill();

  // ── barrel ──
  ctx.fillStyle = '#151c30';
  ctx.fillRect(-16, -230, 40, 70);
  ctx.fillStyle = '#0a0f1c';
  ctx.fillRect(-16, -230, 40, 8);

  // ── glowing energy core ──
  ctx.globalCompositeOperation = 'lighter';
  const coreGrad = ctx.createLinearGradient(0, -160, 0, -20);
  coreGrad.addColorStop(0, 'rgba(0,230,255,0.0)');
  coreGrad.addColorStop(0.4, 'rgba(0,230,255,0.75)');
  coreGrad.addColorStop(1, 'rgba(0,230,255,0.0)');
  ctx.fillStyle = coreGrad;
  ctx.fillRect(-3, -160, 14, 140);
  ctx.fillStyle = 'rgba(0,230,255,0.22)';
  ctx.fillRect(-9, -160, 26, 140);

  // side accents
  ctx.fillStyle = 'rgba(0,230,255,0.3)';
  ctx.beginPath();
  ctx.moveTo(-55, -140);
  ctx.lineTo(-40, -160);
  ctx.lineTo(-30, -160);
  ctx.lineTo(-45, -140);
  ctx.closePath();
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(55, -140);
  ctx.lineTo(70, -160);
  ctx.lineTo(80, -160);
  ctx.lineTo(65, -140);
  ctx.closePath();
  ctx.fill();

  // ── muzzle flash ──
  if (player.muzzle > 0) {
    const m = player.muzzle / 0.07;
    ctx.fillStyle = `rgba(120, 245, 255, ${m * 0.55})`;
    ctx.beginPath();
    ctx.arc(4, -235, 42 * m, 0, TAU);
    ctx.fill();
    ctx.fillStyle = `rgba(255, 255, 255, ${m * 0.9})`;
    ctx.beginPath();
    ctx.arc(4, -235, 16 * m, 0, TAU);
    ctx.fill();
    // rays
    ctx.strokeStyle = `rgba(180,250,255,${m * 0.7})`;
    ctx.lineWidth = 2;
    for (let i = 0; i < 4; i++) {
      const a = i * Math.PI / 2 + 0.3;
      ctx.beginPath();
      ctx.moveTo(4 + Math.cos(a) * 18, -235 + Math.sin(a) * 18);
      ctx.lineTo(4 + Math.cos(a) * 34 * m, -235 + Math.sin(a) * 34 * m);
      ctx.stroke();
    }
  }

  ctx.globalCompositeOperation = 'source-over';
  ctx.restore();
}

// ── crosshair ──
function drawCrosshair() {
  const cx = W / 2, cy = H / 2;
  const gap = 5, len = 12;

  ctx.save();
  ctx.strokeStyle = 'rgba(0, 255, 255, 0.85)';
  ctx.lineWidth = 2;
  ctx.shadowColor = '#00ffff';
  ctx.shadowBlur = 6;
  ctx.beginPath();
  ctx.moveTo(cx - gap - len, cy); ctx.lineTo(cx - gap, cy);
  ctx.moveTo(cx + gap, cy);       ctx.lineTo(cx + gap + len, cy);
  ctx.moveTo(cx, cy - gap - len); ctx.lineTo(cx, cy - gap);
  ctx.moveTo(cx, cy + gap);       ctx.lineTo(cx, cy + gap + len);
  ctx.stroke();
  ctx.shadowBlur = 0;

  ctx.fillStyle = 'rgba(0,255,255,0.95)';
  ctx.fillRect(cx - 1.5, cy - 1.5, 3, 3);

  // hit marker
  if (hitParticles.length > 0) {
    const p = hitParticles[hitParticles.length - 1];
    const a = p.life / p.max;
    ctx.strokeStyle = `rgba(255,255,255,${a})`;
    ctx.lineWidth = 2.5;
    const s = 10;
    ctx.beginPath();
    ctx.moveTo(cx - s, cy - s); ctx.lineTo(cx - s * 0.4, cy - s * 0.4);
    ctx.moveTo(cx + s, cy - s); ctx.lineTo(cx + s * 0.4, cy - s * 0.4);
    ctx.moveTo(cx - s, cy + s); ctx.lineTo(cx - s * 0.4, cy + s * 0.4);
    ctx.moveTo(cx + s, cy + s); ctx.lineTo(cx + s * 0.4, cy + s * 0.4);
    ctx.stroke();
  }
  ctx.restore();
}

// ── minimap ──
function drawMinimap() {
  const size = 130;
  const pad = 14;
  const mx = W - size - pad;
  const my = pad + 44;
  const cs = size / MW;

  ctx.save();
  ctx.fillStyle = 'rgba(0, 0, 0, 0.55)';
  ctx.fillRect(mx, my, size, size);
  ctx.strokeStyle = 'rgba(0, 255, 255, 0.35)';
  ctx.lineWidth = 1;
  ctx.strokeRect(mx, my, size, size);

  // walls
  ctx.fillStyle = 'rgba(0, 170, 220, 0.55)';
  for (let y = 0; y < MH; y++) {
    for (let x = 0; x < MW; x++) {
      if (GRID[y][x]) ctx.fillRect(mx + x * cs, my + y * cs, cs + 0.5, cs + 0.5);
    }
  }

  // enemies
  ctx.fillStyle = '#ff3366';
  for (const e of enemies) {
    ctx.fillRect(mx + e.x * cs - 1.5, my + e.y * cs - 1.5, 3, 3);
  }

  // player
  ctx.fillStyle = '#00ffff';
  ctx.beginPath();
  ctx.arc(mx + player.x * cs, my + player.y * cs, 2.5, 0, TAU);
  ctx.fill();

  // view cone
  ctx.strokeStyle = 'rgba(0,255,255,0.55)';
  ctx.lineWidth = 1.5;
  const px = mx + player.x * cs;
  const py = my + player.y * cs;
  const a0 = player.angle - Math.atan(PLANE_LEN);
  const a1 = player.angle + Math.atan(PLANE_LEN);
  const r = 22;
  ctx.beginPath();
  ctx.moveTo(px, py);
  ctx.lineTo(px + Math.cos(a0) * r, py + Math.sin(a0) * r);
  ctx.moveTo(px, py);
  ctx.lineTo(px + Math.cos(a1) * r, py + Math.sin(a1) * r);
  ctx.stroke();

  // player direction line
  ctx.strokeStyle = '#00ffff';
  ctx.beginPath();
  ctx.moveTo(px, py);
  ctx.lineTo(px + Math.cos(player.angle) * 10, py + Math.sin(player.angle) * 10);
  ctx.stroke();

  ctx.restore();
}

// ════════════════════════════════════════════════════════════
//  MAIN LOOP
// ════════════════════════════════════════════════════════════
let last = performance.now();
function loop(now) {
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;
  update(dt);
  renderScene();
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

})();
</script>
</body>
</html>
